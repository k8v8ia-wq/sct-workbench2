          appState.agents = parsed.agents;
        }
        if (Array.isArray(parsed.files)) {
          appState.files = parsed.files;
        }
      }
    } catch(e) {
      console.warn('LocalStorage load error', e);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          agents: appState.agents,
          files: appState.files
        }));
      } catch (e) {
        console.warn('LocalStorage save error', e);
      }
    }

        }
      }, 2600);

      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        html += `
          <div class="fixed inset-0 z-50 bg-slate-900/60 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl max-w-2xl w-full shadow-2xl border border-slate-200 overflow-hidden">
              <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <button onclick="switchUploadTab('file')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${appState.uploadTab==='file'?'bg-indigo-500 text-white':'bg-slate-800 text-slate-300'}">📄 上传合同/资料文件</button>
                  <button onclick="switchUploadTab('package')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${appState.uploadTab==='package'?'bg-indigo-500 text-white':'bg-slate-800 text-slate-300'}">📦 从 Excel 粘贴批量套餐</button>
                </div>
                <button onclick="closeUploadModal()" class="text-slate-400 hover:text-white">✕</button>
              </div>

              ${appState.uploadTab === 'file' ? `
                <div class="p-6 space-y-4">
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">归属代理商：</label>
                      <select id="fileAgentSelect" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold">
                        ${appState.agents.map(a => `<option value="${a.id}" ${a.id===appState.uploadTarget?'selected':''}>${a.id} - ${escapeHtml(a.name)}</option>`).join('')}
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">文件分类：</label>
                      <select id="fileCategorySelect" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold">
                        <option value="合同文件">📄 合同文件</option>
                        <option value="套餐报价单">📊 套餐报价单</option>
                        <option value="资质证件">🏢 营业执照/资质</option>
                        <option value="操作规范">📌 操作规范/交接</option>
                      </select>
                    </div>
                  </div>
                  <div class="border-2 border-dashed border-indigo-200 bg-indigo-50/50 rounded-2xl p-8 text-center">
                    <input type="file" id="localFileInput" class="hidden" onchange="handleFileChosen(event)" />
                    <button onclick="document.getElementById('localFileInput').click()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-xs">选择电脑中的文件上传</button>
                    <p class="text-xs text-slate-500 mt-2">支持 PDF 合同、图片、TXT、CSV 表格等格式</p>
                  </div>
                </div>
              ` : `
                <div class="p-6 space-y-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">导入归属代理：</label>
                    <select id="pkgTargetSelect" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold">
                      ${appState.agents.map(a => `<option value="${a.id}" ${a.id===appState.uploadTarget?'selected':''}>${a.id} - ${escapeHtml(a.name)}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">从 Excel 直接复制粘贴套餐行（制表符或逗号分隔）：</label>
                    <textarea id="pkgPasteArea" rows="6" placeholder="套餐ID \t 套餐名称 \t 地区 \t 天数 \t 流量 \t 价格 \t 卡类型 \t 备注" class="w-full p-3 rounded-xl border border-slate-300 font-mono text-xs"></textarea>
                  </div>
                  <div class="flex justify-end gap-2">
                    <button onclick="closeUploadModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-600">取消</button>
                    <button onclick="confirmPasteImport()" class="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">确认导入</button>
                  </div>
                </div>
              `}
            </div>
          </div>
        `;
      }

      root.innerHTML = html;

      // 绑定搜索事件
      const searchInput = document.getElementById('globalSearch');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          appState.search = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const nextInput = document.getElementById('globalSearch');
          if (nextInput) { nextInput.focus(); nextInput.setSelectionRange(pos, pos); }
        });
      }
    }

    // ==========================================
    // 事件动作定义
    // ==========================================
    function setFilter(f) { appState.filter = f; render(); }
    function setSettlementFilter(f) { appState.settlementFilter = f; render(); }
    function openAgent(id) { appState.activeAgentId = id; window.scrollTo(0, 0); render(); }
    function closeAgent() { appState.activeAgentId = null; render(); }
    function clearSearch() { appState.search = ''; render(); }
    function closePreview() { appState.previewFile = null; render(); }
    function openUploadModal() { appState.isUploadOpen = true; render(); }
    function closeUploadModal() { appState.isUploadOpen = false; render(); }
    function switchUploadTab(t) { appState.uploadTab = t; render(); }

    function openUploadForAgent(agentId) {
      appState.uploadTarget = agentId;
      appState.uploadTab = 'file';
      appState.isUploadOpen = true;
      render();
    }

    function openImportModalForAgent(agentId) {
      appState.uploadTarget = agentId;
      appState.uploadTab = 'package';
      appState.isUploadOpen = true;
      render();
    }

    function previewDoc(id) {
      const f = appState.files.find(x => x.id === id);
      if (f) {
        appState.previewFile = f;
        render();
      }
    }

    function downloadDoc(id) {
      const f = appState.files.find(x => x.id === id);
      if (!f) return;
      if (f.dataUrl) {
        const a = document.createElement('a');
        a.href = f.dataUrl;
        a.download = f.name;
        a.click();
      } else if (f.textContent) {
        const blob = new Blob(['\uFEFF' + f.textContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = f.name;
        a.click();
        URL.revokeObjectURL(url);
      }
      showToast(`正在下载：${f.name}`);
    }

    function handleFileChosen(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const targetAgent = document.getElementById('fileAgentSelect').value;
      const targetCategory = document.getElementById('fileCategorySelect').value;
      const isText = file.type.includes('text') || file.name.endsWith('.txt') || file.name.endsWith('.csv');

      const reader = new FileReader();
      if (isText) {
        reader.onload = (evt) => {
          const rec = {
            id: 'FILE-' + Date.now(),
            agentId: targetAgent,
            name: file.name,
            category: targetCategory,
            size: (file.size / 1024).toFixed(1) + ' KB',
            uploadDate: new Date().toISOString().slice(0, 10),
            textContent: evt.target.result
          };
          appState.files.unshift(rec);
          saveState();
          appState.isUploadOpen = false;
          showToast(`已成功上传 ${file.name} 到 ${targetAgent}`);
        };
        reader.readAsText(file, 'utf-8');
      } else {
        reader.onload = (evt) => {
          const rec = {
            id: 'FILE-' + Date.now(),
            agentId: targetAgent,
            name: file.name,
            category: targetCategory,
            size: (file.size / 1024).toFixed(1) + ' KB',
            uploadDate: new Date().toISOString().slice(0, 10),
            dataUrl: evt.target.result,
            mimeType: file.type
          };
          appState.files.unshift(rec);
          saveState();
          appState.isUploadOpen = false;
          showToast(`已成功上传 ${file.name} 到 ${targetAgent}`);
        };
        reader.readAsDataURL(file);
      }
    }

    function confirmPasteImport() {
      const targetId = document.getElementById('pkgTargetSelect').value;
      const text = document.getElementById('pkgPasteArea').value.trim();
      if (!text) return;
      const lines = text.split(/\r?\n/).filter(Boolean);
      const newPkgs = [];
      lines.forEach((line, idx) => {
        const cols = line.includes('\t') ? line.split('\t').map(c => c.trim()) : line.split(',').map(c => c.trim());
        if (cols[0] && (cols[0].includes('ID') || cols[0].includes('套餐'))) return;
        newPkgs.push({
          id: cols[0] || 'PKG-' + (idx + 1),
          name: cols[1] || '新套餐',
          region: cols[2] || '-',
          days: cols[3] || '-',
          data: cols[4] || '-',
          price: cols[5] || '-',
          cardType: cols[6] || 'eSIM',
          remark: cols[7] || ''
        });
      });
      if (newPkgs.length === 0) return;
      const agent = appState.agents.find(a => a.id === targetId);
      if (agent) {
        agent.packages = [...(agent.packages||[]), ...newPkgs];
        saveState();
        appState.isUploadOpen = false;
        showToast(`成功为 ${targetId} 导入 ${newPkgs.length} 条套餐！`);
      }
    }

    function promptAddCard(agentId) {
      const qtyStr = prompt(`请输入本次为 ${agentId} 出卡的数量（张）：`, '100');
      if (qtyStr === null) return;
      const qty = parseInt(qtyStr, 10) || 0;
      const desc = prompt('请输入出卡说明或关联套餐：', '批量出卡出货');
      const agent = appState.agents.find(a => a.id === agentId);
      if (agent) {
        agent.totalCardsIssued = (Number(agent.totalCardsIssued)||0) + qty;
        agent.cardLogs = agent.cardLogs || [];
        agent.cardLogs.unshift({
          id: 'LOG-' + Date.now(),
          date: new Date().toISOString().slice(0, 10),
          type: '出卡记录',
          quantity: qty,
          pkgName: desc || '出卡',
          note: '手动登记出卡流水'
        });
        saveState();
        showToast(`已为 ${agentId} 增加 ${qty} 张出卡记录`);
      }
    }

    function exportBackup() {
      const str = JSON.stringify({ agents: appState.agents, files: appState.files }, null, 2);
      const blob = new Blob([str], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `SCT_代理工作台全量备份_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已导出全量数据备份');
    }

    // 初始化运行
    render();
  </script>
</body>
</html>
