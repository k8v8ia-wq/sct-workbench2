    // ==========================================
    // IndexedDB 本地文件持久层（支持存储大体积PDF合同、图片、表格）
    // ==========================================
    const DB_NAME = 'SCT_Agent_Workbench_DB';
    const DB_VERSION = 1;
    const FILE_STORE = 'agent_files';

    function openFileDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(FILE_STORE)) {
            db.createObjectStore(FILE_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveFileToDB(fileRecord) {
      try {
        const db = await openFileDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(FILE_STORE, 'readwrite');
          tx.objectStore(FILE_STORE).put(fileRecord);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      } catch (e) {
        console.error('IndexedDB save error:', e);
        return false;
      }
    }

    async function getAllFilesFromDB() {
      try {
        const db = await openFileDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(FILE_STORE, 'readonly');
          const req = tx.objectStore(FILE_STORE).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        console.error('IndexedDB read error:', e);
        return [];
      }
    }

    async function deleteFileFromDB(id) {
      try {
        const db = await openFileDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(FILE_STORE, 'readwrite');
          tx.objectStore(FILE_STORE).delete(id);
          tx.oncomplete = () => resolve(true);
          tx.onerror = () => reject(tx.error);
        });
      } catch (e) {
        console.error('IndexedDB delete error:', e);
        return false;
      }
    }

        const active = agents.filter((a) => a.status === 'active').length;
        const lowDemand = agents.filter((a) => a.status === 'low_demand').length;
        const dormant = agents.filter((a) => a.status === 'dormant').length;
        const renewal = agents.filter((a) => a.needsContractRenewal).length;
        const totalPackages = agents.reduce((acc, a) => acc + (a.packages?.length || 0), 0);
        const totalCards = agents.reduce((acc, a) => acc + (Number(a.totalCardsIssued) || 0), 0);
        const hasAssets = agents.filter(
          (a) =>
            (a.packages?.length || 0) > 0 ||
            (a.cardLogs?.length || 0) > 0 ||
            files.some((f) => f.agentId === a.id)
        ).length;
        return { total, active, lowDemand, dormant, renewal, totalPackages, totalCards, totalFiles: files.length, hasAssets };
      }, [agents, files]);

      const searchMatchedFiles = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return [];
        return files.filter((f) => {
          const agent = agents.find((a) => a.id === f.agentId);
          return (
            f.name.toLowerCase().includes(q) ||
            f.category.toLowerCase().includes(q) ||
            f.agentId.toLowerCase().includes(q) ||
            (agent && agent.name.toLowerCase().includes(q)) ||
            (f.textContent && f.textContent.toLowerCase().includes(q))
          );
        });
      }, [files, agents, searchQuery]);

      const searchMatchedPackages = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return [];
        const results = [];
        agents.forEach((agent) => {
          (agent.packages || []).forEach((pkg) => {
            if (
              (pkg.id && pkg.id.toLowerCase().includes(q)) ||
              (pkg.name && pkg.name.toLowerCase().includes(q)) ||
              (pkg.region && pkg.region.toLowerCase().includes(q)) ||
              (pkg.remark && pkg.remark.toLowerCase().includes(q)) ||
              agent.id.toLowerCase().includes(q) ||
              agent.name.toLowerCase().includes(q)
            ) {
              results.push({ ...pkg, agentId: agent.id, agentName: agent.name });
            }
          });
        });
        return results;
      }, [agents, searchQuery]);

      const filteredAgents = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        return agents.filter((agent) => {
          if (statusFilter === 'active' && agent.status !== 'active') return false;
          if (statusFilter === 'low_demand' && agent.status !== 'low_demand') return false;
          if (statusFilter === 'dormant' && agent.status !== 'dormant') return false;
          if (statusFilter === 'renewal' && !agent.needsContractRenewal) return false;
          if (statusFilter === 'has_assets') {
            const hasAsset =
              (agent.packages?.length || 0) > 0 ||
              (agent.cardLogs?.length || 0) > 0 ||
              files.some((f) => f.agentId === agent.id);
            if (!hasAsset) return false;
          }
          if (settlementFilter !== 'all' && agent.settlement !== settlementFilter) return false;
          if (!q) return true;

          const matchBasic =
            agent.id.toLowerCase().includes(q) ||
            agent.name.toLowerCase().includes(q) ||
            (agent.contact && agent.contact.toLowerCase().includes(q)) ||
            (agent.address && agent.address.toLowerCase().includes(q)) ||
            (agent.operationsNote && agent.operationsNote.toLowerCase().includes(q)) ||
            (agent.keyAlert && agent.keyAlert.toLowerCase().includes(q)) ||
            (agent.cardFee && agent.cardFee.toLowerCase().includes(q)) ||
            (agent.settlement && agent.settlement.toLowerCase().includes(q)) ||
            (agent.tags && agent.tags.some((t) => t.toLowerCase().includes(q)));

          const matchPkg = (agent.packages || []).some(
            (p) =>
              (p.id && p.id.toLowerCase().includes(q)) ||
              (p.name && p.name.toLowerCase().includes(q)) ||
              (p.region && p.region.toLowerCase().includes(q)) ||
              (p.remark && p.remark.toLowerCase().includes(q))
          );

          const matchFile = files
            .filter((f) => f.agentId === agent.id)
            .some(
              (f) =>
                f.name.toLowerCase().includes(q) ||
                f.category.toLowerCase().includes(q) ||
                (f.textContent && f.textContent.toLowerCase().includes(q))
            );

          return matchBasic || matchPkg || matchFile;
        });
      }, [agents, files, searchQuery, statusFilter, settlementFilter]);

      const activeAgent = useMemo(() => {
        if (!activeAgentId) return null;
        return agents.find((a) => a.id === activeAgentId) || null;
      }, [agents, activeAgentId]);

      const activeAgentFiles = useMemo(() => {
        if (!activeAgent) return [];
        return files.filter((f) => f.agentId === activeAgent.id || f.agentId === 'ALL');
      }, [files, activeAgent]);

      // ==========================================
      // 文件上传、在线阅览与下载
      // ==========================================
      const handleUploadFiles = async (e) => {
        const selectedFiles = Array.from(e.target.files || []);
        if (selectedFiles.length === 0) return;
        const newFileRecords = [];
        for (const file of selectedFiles) {
          const isTextOrCsv = file.type.includes('text') || file.name.endsWith('.csv') || file.name.endsWith('.tsv') || file.name.endsWith('.txt') || file.name.endsWith('.json') || file.name.endsWith('.md');
          const dataUrl = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (evt) => resolve(evt.target?.result || '');
            reader.readAsDataURL(file);
          });
          let textContent = null;
          if (isTextOrCsv) {
            textContent = await new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = (evt) => resolve(evt.target?.result || '');
              reader.readAsText(file, 'utf-8');
            });
          }
          const sizeKB = (file.size / 1024).toFixed(1);
          const sizeStr = file.size > 1024 * 1024 ? `${(file.size / (1024 * 1024)).toFixed(2)} MB` : `${sizeKB} KB`;
          const record = {
            id: `FILE-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            agentId: uploadTargetAgent,
            name: file.name,
            category: uploadCategory,
            size: sizeStr,
            uploadDate: new Date().toISOString().slice(0, 10),
            mimeType: file.type || 'application/octet-stream',
            dataUrl,
            textContent
          };
          await saveFileToDB(record);
          newFileRecords.push(record);
        }
        setFiles((prev) => [...newFileRecords, ...prev]);
        e.target.value = '';
        setIsUploadModalOpen(false);
        showToast(`已成功上传 ${newFileRecords.length} 个文件至 ${uploadTargetAgent}，可随时搜索、在线阅览或下载！`);
      };

      const handleDownloadFile = (fileObj) => {
        if (fileObj.dataUrl) {
          const a = document.createElement('a');
          a.href = fileObj.dataUrl;
          a.download = fileObj.name;
          a.click();
          showToast(`正在下载文件：${fileObj.name}`);
        } else if (fileObj.textContent) {
          const blob = new Blob(['\uFEFF' + fileObj.textContent], { type: `${fileObj.mimeType || 'text/plain'};charset=utf-8;` });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileObj.name;
          a.click();
          URL.revokeObjectURL(url);
          showToast(`正在下载文件：${fileObj.name}`);
        }
      };

      const handleDeleteFile = async (fileId) => {
        await deleteFileFromDB(fileId);
        setFiles((prev) => prev.filter((f) => f.id !== fileId));
        if (previewFile?.id === fileId) setPreviewFile(null);
        showToast('已删除该文件');
      };

      // ==========================================
      // 套餐批量粘贴解析与导入
      // ==========================================
      const parsedPreviewPackages = useMemo(() => {
        if (!pasteText.trim()) return [];
        const lines = pasteText.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        const results = [];
        lines.forEach((line, idx) => {
          const cols = line.includes('\t') ? line.split('\t').map((c) => c.trim()) : line.split(',').map((c) => c.trim());
          const firstColUpper = (cols[0] || '').toUpperCase();
          if (idx === 0 && (firstColUpper.includes('代理号') || firstColUpper.includes('套餐') || firstColUpper === 'SCT_ID' || firstColUpper === 'ID')) return;
          if (importTargetAgent === 'AUTO') {
            let rawAgentId = (cols[0] || '').toUpperCase().replace(/\s+/g, '');
            if (/^\d{4}$/.test(rawAgentId)) rawAgentId = 'SCT' + rawAgentId;
            results.push({
              targetAgentId: rawAgentId || '未指定',
              id: cols[1] || `PKG-${Date.now().toString().slice(-4)}-${idx + 1}`,
              name: cols[2] || cols[1] || '未命名套餐',
              region: cols[3] || '-',
              days: cols[4] || '-',
              data: cols[5] || '-',
              price: cols[6] || '-',
              cardType: cols[7] || 'eSIM/SIM',
              remark: cols[8] || ''
            });
          } else {
            const maybeSct = (cols[0] || '').toUpperCase();
            const hasAgentCol = maybeSct.startsWith('SCT');
            const offset = hasAgentCol ? 1 : 0;
            results.push({
              targetAgentId: importTargetAgent,
              id: cols[offset] || `PKG-${Date.now().toString().slice(-4)}-${idx + 1}`,
              name: cols[offset + 1] || cols[offset] || '未命名套餐',
              region: cols[offset + 2] || '-',
              days: cols[offset + 3] || '-',
              data: cols[offset + 4] || '-',
              price: cols[offset + 5] || '-',
              cardType: cols[offset + 6] || 'eSIM/SIM',
              remark: cols[offset + 7] || ''
            });
          }
        });
        return results;
      }, [pasteText, importTargetAgent]);

      const handleConfirmBatchImport = () => {
        if (parsedPreviewPackages.length === 0) return;
        let importedCount = 0;
        const updatedAgents = agents.map((agent) => {
          const matchedPkgs = parsedPreviewPackages.filter((p) => p.targetAgentId.toUpperCase() === agent.id.toUpperCase());
          if (matchedPkgs.length > 0) {
            importedCount += matchedPkgs.length;
            const cleanPkgs = matchedPkgs.map(({ targetAgentId, ...rest }) => rest);
            return { ...agent, packages: [...(agent.packages || []), ...cleanPkgs] };
          }
          return agent;
        });
        if (importedCount === 0) {
          showToast('未匹配到有效代理号，请在上方下拉框指定要导入的代理商');
          return;
        }
        setAgents(updatedAgents);
        setPasteText('');
        setIsUploadModalOpen(false);
        showToast(`成功导入 ${importedCount} 条代理套餐！`);
      };

      // ==========================================
      // 单条保存/更新
      // ==========================================
      const handleSaveSinglePackage = (e) => {
        e.preventDefault();
        if (!pkgForm.name.trim()) return;
        const pkgItem = {
          id: pkgForm.id.trim() || `PKG-${Date.now().toString().slice(-5)}`,
          name: pkgForm.name.trim(),
          region: pkgForm.region.trim() || '-',
          days: pkgForm.days.trim() || '-',
          data: pkgForm.data.trim() || '-',
          price: pkgForm.price.trim() || '-',
          cardType: pkgForm.cardType.trim() || 'eSIM',
          remark: pkgForm.remark.trim()
        };
        setAgents((prev) =>
          prev.map((a) => {
            if (a.id !== pkgForm.agentId) return a;
            if (editingPkgIndex !== null) {
              const next = [...(a.packages || [])];
              next[editingPkgIndex] = pkgItem;
              return { ...a, packages: next };
            }
            return { ...a, packages: [...(a.packages || []), pkgItem] };
          })
        );
        setIsAddPkgModalOpen(false);
        setEditingPkgIndex(null);
        showToast('已保存套餐信息');
      };

      const handleDeletePackage = (agentId, idx) => {
        setAgents((prev) => prev.map((a) => a.id === agentId ? { ...a, packages: (a.packages || []).filter((_, i) => i !== idx) } : a));
        showToast('已删除套餐');
      };

      const handleSaveCardLog = (e) => {
        e.preventDefault();
        const qty = Number(cardLogForm.quantity) || 0;
        const newLog = {
          id: `LOG-${Date.now()}`,
          date: cardLogForm.date || new Date().toISOString().slice(0, 10),
          type: cardLogForm.type || '出卡记录',
          quantity: qty,
          pkgName: cardLogForm.pkgName || '-',
          note: cardLogForm.note || ''
        };
        setAgents((prev) =>
          prev.map((a) => {
            if (a.id !== cardLogForm.agentId) return a;
            const nextTotal = (Number(a.totalCardsIssued) || 0) + qty;
            return {
              ...a,
              totalCardsIssued: nextTotal,
              cardVolumeSummary: nextTotal > 0 ? `累计已出 ${nextTotal} 张` : a.cardVolumeSummary,
              cardLogs: [newLog, ...(a.cardLogs || [])]
            };
          })
        );
        setIsAddCardLogModalOpen(false);
        showToast(`已登记 ${cardLogForm.agentId} 出卡/流水记录`);
      };

      const handleDeleteCardLog = (agentId, logId, qty) => {
        setAgents((prev) =>
          prev.map((a) => {
            if (a.id !== agentId) return a;
            const nextTotal = Math.max(0, (Number(a.totalCardsIssued) || 0) - (Number(qty) || 0));
            return { ...a, totalCardsIssued: nextTotal, cardLogs: (a.cardLogs || []).filter((l) => l.id !== logId) };
          })
        );
        showToast('已删除该条出卡流水');
      };

      const handleSaveAgentEdit = (e) => {
        e.preventDefault();
        if (!editingAgentData) return;
        setAgents((prev) => prev.map((a) => (a.id === editingAgentData.id ? { ...editingAgentData } : a)));
        setIsEditAgentModalOpen(false);
        showToast(`已更新 ${editingAgentData.id} 代理档案`);
      };

      // 备份与恢复 JSON
      const handleExportJSON = () => {
        const dataStr = JSON.stringify({ agents, files }, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `SCT_代理商全景工作台全量备份_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('已导出全量数据备份 (.json)');
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (evt) => {
          try {
            const parsed = JSON.parse(evt.target?.result || '{}');
            if (Array.isArray(parsed.agents)) {
              setAgents(parsed.agents);
            }
            if (Array.isArray(parsed.files)) {
              setFiles(parsed.files);
              for (const f of parsed.files) {
                await saveFileToDB(f);
              }
            }
            showToast('已成功恢复全量代理商与文件数据！');
          } catch (err) {
            showToast('备份文件格式有误，无法解析');
          }
        };
        reader.readAsText(file, 'utf-8');
        e.target.value = '';
      };

      const renderStatusPill = (status) => {
        if (status === 'active') {
          return (
            <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">
              <span className="w-2 h-2 rounded-full bg-emerald-600"></span>主力活跃
            </span>
          );
        }
        if (status === 'low_demand') {
          return (
            <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-200/80 text-slate-700 border border-slate-300">
              <span className="w-2 h-2 rounded-full bg-slate-500"></span>很少需求(标灰)
            </span>
          );
        }
        return (
          <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-300">
            <Clock className="w-3 h-3" />一年+无动静
          </span>
        );
      };

      return (
        <div className="min-h-screen bg-slate-100 text-slate-900 flex flex-col font-sans">
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-xl bg-slate-900 text-white border border-slate-700">
              <CheckCircle2 className="w-4 h-4 text-emerald-400 shrink-0" />
              <span className="text-sm font-semibold">{toast}</span>
            </div>
          )}

          <header className="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5">
              <div className="flex flex-wrap items-center justify-between gap-4">
                <div onClick={() => setActiveAgentId(null)} className="flex items-center gap-3 cursor-pointer group">
                  <div className="w-10 h-10 rounded-xl bg-indigo-500 group-hover:bg-indigo-400 flex items-center justify-center text-white font-black text-base shadow-xs transition">SCT</div>
                  <div>
                    <div className="flex items-center gap-2">
                      <h1 className="text-base sm:text-lg font-extrabold tracking-tight text-white">SCT 代理商全景工作台</h1>
                      <span className="hidden sm:inline-block text-[11px] px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 font-semibold">点击代理即看全景</span>
                    </div>
                    <p className="text-xs text-slate-400">19 家代理商 · {stats.totalPackages} 个套餐 · {stats.totalFiles} 份合同/文件 · 累计已登记 {stats.totalCards} 张出卡</p>
                  </div>
                </div>

                <div className="relative flex-1 min-w-[270px] max-w-xl">
                  <Search className="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" />
                  <input ref={searchInputRef} type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="搜索代理号(0175/259)、客户名、套餐(帕劳/330259005)、或已上传的合同文件名..." className="w-full pl-10 pr-16 py-2.5 bg-slate-800/90 focus:bg-slate-800 rounded-xl border border-slate-700 focus:border-indigo-400 focus:outline-none text-sm text-white placeholder:text-slate-400 transition" />
                  {searchQuery ? (
                    <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-1/2 -translate-y-1/2 text-xs text-slate-300 hover:text-white bg-slate-700 px-2 py-0.5 rounded-md">清除</button>
                  ) : (
                    <span className="hidden sm:inline-block absolute right-3 top-1/2 -translate-y-1/2 text-[11px] font-mono text-slate-400 bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">/ 键搜索</span>
                  )}
                </div>

                <div className="flex items-center gap-2">
                  <button onClick={() => { setUploadTargetAgent(activeAgentId || 'SCT0259'); setImportTargetAgent(activeAgentId || 'AUTO'); setUploadTab('file'); setIsUploadModalOpen(true); }} className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-indigo-500 hover:bg-indigo-400 text-white text-xs sm:text-sm font-bold shadow-xs transition cursor-pointer">
                    <Upload className="w-4 h-4" /> 上传合同/导入套餐
                  </button>
                  <button onClick={handleExportJSON} className="inline-flex items-center gap-1 px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold transition cursor-pointer" title="导出JSON全量备份">
                    <Download className="w-3.5 h-3.5" /> 备份数据
                  </button>
                  <input ref={jsonRestoreInputRef} type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                  <button onClick={() => jsonRestoreInputRef.current?.click()} className="inline-flex items-center gap-1 px-2.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs font-semibold transition cursor-pointer" title="从JSON备份文件恢复数据">
                    恢复数据
                  </button>
                </div>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
            {searchQuery.trim() !== '' && (searchMatchedFiles.length > 0 || searchMatchedPackages.length > 0) && (
              <div className="mb-6 bg-white rounded-2xl border-2 border-indigo-500/80 shadow-md p-4 space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-2.5">
                  <div className="flex items-center gap-2">
                    <Sparkles className="w-4 h-4 text-indigo-600" />
                    <span className="text-sm font-extrabold text-slate-900">关键词 “{searchQuery}” 直接匹配到的文件与套餐</span>
                  </div>
                  <span className="text-xs text-slate-500">匹配到 {searchMatchedFiles.length} 份文件 · {searchMatchedPackages.length} 个套餐</span>
                </div>
                {searchMatchedFiles.length > 0 && (
                  <div>
                    <div className="text-xs font-bold text-slate-500 mb-2">📄 匹配到的合同 / 报价文件（点击直接在线阅览或下载）：</div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                      {searchMatchedFiles.map((f) => (
                        <div key={f.id} className="p-3 rounded-xl bg-indigo-50/50 border border-indigo-200 flex items-center justify-between gap-3">
                          <div className="min-w-0">
                            <div className="flex items-center gap-2">
                              <span className="px-2 py-0.5 rounded bg-indigo-600 text-white font-mono text-[11px] font-bold">{f.agentId}</span>
                              <span className="text-xs font-bold text-slate-900 truncate">{f.name}</span>
                            </div>
                            <div className="text-[11px] text-slate-500 mt-1">分类：{f.category} · 大小：{f.size} · 日期：{f.uploadDate}</div>
                          </div>
                          <div className="flex items-center gap-1.5 shrink-0">
                            <button onClick={() => setPreviewFile(f)} className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold cursor-pointer"><Eye className="w-3.5 h-3.5" /> 在线阅览</button>
                            <button onClick={() => handleDownloadFile(f)} className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-xs font-bold cursor-pointer"><Download className="w-3.5 h-3.5" /> 下载</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {searchMatchedPackages.length > 0 && (
                  <div>
                    <div className="text-xs font-bold text-slate-500 mb-2">📦 匹配到的代理套餐（点击可进入对应代理全景页）：</div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                      {searchMatchedPackages.map((p, idx) => (
                        <div key={idx} onClick={() => setActiveAgentId(p.agentId)} className="p-3 rounded-xl bg-emerald-50/50 hover:bg-emerald-50 border border-emerald-200 flex items-center justify-between gap-3 cursor-pointer transition">
                          <div>
                            <div className="flex items-center gap-2">
                              <span className="px-2 py-0.5 rounded bg-slate-900 text-white font-mono text-[11px] font-bold">{p.agentId} {p.agentName}</span>
                              <span className="font-mono text-xs font-bold text-indigo-700">ID: {p.id}</span>

                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block font-bold text-slate-700 mb-1">卡费标准</label><input type="text" value={editingAgentData.cardFee} onChange={(e) => setEditingAgentData({ ...editingAgentData, cardFee: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-300" /></div>
                    <div><label className="block font-bold text-slate-700 mb-1">对接人联系方式</label><input type="text" value={editingAgentData.contact} onChange={(e) => setEditingAgentData({ ...editingAgentData, contact: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-300" /></div>
                  </div>
                  <div><label className="block font-bold text-slate-700 mb-1">主界面一句话重点/红线提醒</label><input type="text" value={editingAgentData.keyAlert || ''} onChange={(e) => setEditingAgentData({ ...editingAgentData, keyAlert: e.target.value })} className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold text-indigo-950" /></div>
                  <div><label className="block font-bold text-slate-700 mb-1">运营交接详情备注</label><textarea rows={4} value={editingAgentData.operationsNote} onChange={(e) => setEditingAgentData({ ...editingAgentData, operationsNote: e.target.value })} className="w-full p-3 rounded-xl border border-slate-300 leading-relaxed" /></div>
                  <div className="flex items-center gap-2">
                    <input type="checkbox" id="editRenewalCheck" checked={editingAgentData.needsContractRenewal} onChange={(e) => setEditingAgentData({ ...editingAgentData, needsContractRenewal: e.target.checked, contractStatus: e.target.checked ? '有签合同，需更新' : '已签有效合同' })} />
                    <label htmlFor="editRenewalCheck" className="font-bold text-amber-800">标记为“合同需跟进更新”</label>
                  </div>
                  <div className="pt-3 flex justify-end gap-2">
                    <button type="button" onClick={() => setIsEditAgentModalOpen(false)} className="px-4 py-2 rounded-xl border border-slate-300 font-bold text-slate-600">取消</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-indigo-600 text-white font-bold">保存修改</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 渲染应用挂载到根节点
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
