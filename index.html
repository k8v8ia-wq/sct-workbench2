    function applyLoadedData(parsed) {
      if (!parsed) return false;
      let changed = false;
      if (Array.isArray(parsed.agents) && parsed.agents.length > 0) {
        appState.agents = parsed.agents.map(a => ({
          ...a,
          packageTables: Array.isArray(a.packageTables) ? a.packageTables : []

        changed = true;
      }
      return changed;
    }

    // 启动时加载顺序：1. 先从本地 IndexedDB / localStorage 极速渲染 -> 2. 再从 Supabase 云端拉取最新数据覆盖
    async function bootDataLoad() {
      // A. 兼容旧版 localStorage 数据迁移
      try {
        const legacySaved = localStorage.getItem(STORAGE_KEY);
        if (legacySaved) {
          applyLoadedData(JSON.parse(legacySaved));
        }
      } catch (e) {}

      // B. 从大容量 IndexedDB 读取
      if (window.localforage) {
        try {
          const idbSaved = await localforage.getItem(STORAGE_KEY);
          if (idbSaved) {
            applyLoadedData(idbSaved);
            render();
          }
        } catch (e) {
          console.warn('IndexedDB load error', e);
        }
      }

      // C. 如果配置了 Supabase，从云端拉取最新状态
      if (initSupabaseClient()) {
        await pullFromCloud(false);
      } else {
        render();
      }
    }

    // 从 Supabase 云端拉取最新数据
    async function pullFromCloud(showSuccessToast = true) {
      if (!supabaseClient) return;
      appState.cloudStatus = 'syncing';
      render();

      try {
        const { data, error } = await supabaseClient
          .from(SUPABASE_TABLE)
          .select('data, updated_at')
          .eq('id', SUPABASE_ROW_ID)
          .maybeSingle();

        if (error) throw error;

        if (data && data.data) {
          applyLoadedData(data.data);
          // 同步写入本地大容量 IndexedDB 缓存
          if (window.localforage) {
            await localforage.setItem(STORAGE_KEY, { agents: appState.agents, files: appState.files });
          }
          appState.cloudStatus = 'synced';
          appState.lastSyncTime = data.updated_at ? new Date(data.updated_at).toLocaleTimeString() : new Date().toLocaleTimeString();
          if (showSuccessToast) showToast('☁️ 已从 Supabase 云端拉取最新套餐与合同数据！');
        } else {
          // 云端表为空，自动将当前本地数据初始化推送到云端
          await pushToCloud(false);
          if (showSuccessToast) showToast('☁️ 云端初始化完成，已上传当前工作台数据！');
        }
      } catch (err) {
        console.error('Supabase pull error:', err);
        appState.cloudStatus = 'error';
        appState.cloudErrorMsg = err.message || '拉取失败，请检查表名或 RLS 策略';
        if (showSuccessToast) showToast('⚠️ 云端拉取失败：' + appState.cloudErrorMsg);
      }
      render();
    }

    // 推送当前状态到 Supabase 云端
    async function pushToCloud(showSuccessToast = false) {
      if (!supabaseClient) return;
      appState.cloudStatus = 'syncing';
      render();

      const payload = {
        agents: appState.agents,
        files: appState.files
      };

      try {
        const { error } = await supabaseClient
          .from(SUPABASE_TABLE)
          .upsert({
            id: SUPABASE_ROW_ID,
            data: payload,
            updated_at: new Date().toISOString()
          }, { onConflict: 'id' });

        if (error) throw error;

        appState.cloudStatus = 'synced';
        appState.lastSyncTime = new Date().toLocaleTimeString();
        appState.cloudErrorMsg = '';
        if (showSuccessToast) showToast('☁️ 已实时同步至 Supabase 云端！');
      } catch (err) {
        console.error('Supabase push error:', err);
        appState.cloudStatus = 'error';
        appState.cloudErrorMsg = err.message || '云端写入失败';
        showToast('⚠️ 云端保存失败（已保存在本地大容量缓存）：' + appState.cloudErrorMsg);
      }
      render();
    }

    async function saveState() {

        agents: appState.agents,
        files: appState.files
      };

      if (window.localforage) {
        try {
          await localforage.setItem(STORAGE_KEY, payload);
        } catch (e) {
          console.warn('IndexedDB save error', e);
        }
      }

      // 2. 推送至 Supabase 云端数据库
      if (supabaseClient) {
        await pushToCloud(false);
      }
    }

      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

                      <label class="block text-xs font-bold text-slate-700 mb-1">2. 更新方式（当价格/套餐变动时）：</label>
                      <select id="xlsxModeSelect" onchange="appState.xlsxImportMode = this.value" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-bold bg-slate-50">
                        <option value="replace" ${appState.xlsxImportMode==='replace'?'selected':''}>🔄 覆盖更新该代理现有套餐表（推荐用于价格更新）</option>
                        <option value="append" ${appState.xlsxImportMode==='append'?'selected':''}>➕ 追加为该代理的新套餐表（保留旧表）</option>
                      </select>
                    </div>
                  </div>

                  <div class="border-2 border-dashed border-indigo-300 hover:border-indigo-500 bg-indigo-50/40 rounded-2xl p-6 text-center transition">
                    <input type="file" id="xlsxPkgInput" accept=".xlsx,.xls,.csv" class="hidden" onchange="handleXlsxFileSelected(event)" />
                    <button onclick="document.getElementById('xlsxPkgInput').click()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-extrabold shadow-xs cursor-pointer">
                      📂 点击选择代理套餐 Excel 文件 (.xlsx / .xls / .csv)
                    </button>
                    <p class="text-xs text-slate-500 mt-2">
                      无需统一格式！系统会自动识别该代理 Excel 表格原本的列标题，导入后自动同步至 Supabase 云端。
                    </p>
                  </div>

                  ${appState.pendingXlsxSheets && appState.pendingXlsxSheets.length > 0 ? `
                    <div class="p-4 rounded-xl bg-emerald-50 border border-emerald-200 space-y-3">
                      <div class="flex items-center justify-between">
                        <span class="text-xs font-extrabold text-emerald-900">
                          ✅ 已解析文件：《${escapeHtml(appState.pendingXlsxFileName)}》，包含 ${appState.pendingXlsxSheets.length} 个工作表：
                        </span>
                      </div>
                      <div class="space-y-2 max-h-56 overflow-y-auto">
                        ${appState.pendingXlsxSheets.map((sh) => `
                          <div class="p-3 rounded-lg bg-white border border-emerald-200 text-xs">
                            <div class="font-bold text-slate-900 mb-1">📑 工作表：${escapeHtml(sh.sheetName)} （共 ${sh.rows.length} 行套餐数据）</div>
                            <div class="text-slate-500 truncate">识别到的表头列：${sh.headers.map(h => `<span class="px-1.5 py-0.5 bg-slate-100 rounded mr-1 text-slate-700 font-semibold">${escapeHtml(h)}</span>`).join('')}</div>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  ` : ''}

                  <div class="flex justify-end gap-2 pt-2">
                    <button onclick="closeUploadModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-bold text-slate-600 cursor-pointer">取消</button>
                    <button onclick="confirmXlsxImport()" ${!appState.pendingXlsxSheets || appState.pendingXlsxSheets.length===0 ? 'disabled' : ''} class="px-5 py-2 rounded-xl ${appState.pendingXlsxSheets && appState.pendingXlsxSheets.length>0 ? 'bg-indigo-600 hover:bg-indigo-500 cursor-pointer' : 'bg-slate-300 cursor-not-allowed'} text-white text-xs font-extrabold">
                      确认导入并同步云端
                    </button>
                  </div>
                </div>
              ` : `
                <div class="p-6 space-y-4">
                  <div class="grid grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">归属代理商：</label>
                      <select id="fileAgentSelect" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold">
                        ${appState.agents.map(a => `<option value="${a.id}" ${a.id===appState.uploadTarget?'selected':''}>${a.id} - ${escapeHtml(a.name)}</option>`).join('')}
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">文件分类：</label>
                      <select id="fileCategorySelect" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs font-bold">
                        <option value="合同文件">📄 合同文件</option>
                        <option value="资质证件">🏢 营业执照/资质</option>
                        <option value="操作规范">📌 操作规范/交接</option>
                      </select>
                    </div>
                  </div>
                  <div class="border-2 border-dashed border-indigo-200 bg-indigo-50/50 rounded-2xl p-8 text-center">
                    <input type="file" id="localFileInput" class="hidden" onchange="handleFileChosen(event)" />
                    <button onclick="document.getElementById('localFileInput').click()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-xs cursor-pointer">选择电脑中的合同/文件上传</button>
                    <p class="text-xs text-slate-500 mt-2">支持 PDF 合同、图片、TXT、CSV 等格式（自动存入大容量缓存与云端）</p>
                  </div>
                </div>
              `}
            </div>
          </div>
        `;
      }

      root.innerHTML = html;

      // 绑定全局搜索输入保持焦点
      const searchInput = document.getElementById('globalSearch');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          appState.search = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const nextInput = document.getElementById('globalSearch');
          if (nextInput) { nextInput.focus(); nextInput.setSelectionRange(pos, pos); }
        });
      }

      // 绑定代理详情页内套餐搜索输入保持焦点
      const pkgInput = document.getElementById('agentPkgSearchInput');
      if (pkgInput) {
        pkgInput.addEventListener('input', (e) => {
          appState.pkgSearchInAgent = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const nextPkgInput = document.getElementById('agentPkgSearchInput');
          if (nextPkgInput) { nextPkgInput.focus(); nextPkgInput.setSelectionRange(pos, pos); }
        });
      }
    }

    // ==========================================
    // 交互与云端配置函数
    // ==========================================
    function setFilter(f) { appState.filter = f; render(); }
    function setSettlementFilter(f) { appState.settlementFilter = f; render(); }
    function openAgent(id) { appState.activeAgentId = id; appState.pkgSearchInAgent = ''; window.scrollTo(0, 0); render(); }
    function closeAgent() { appState.activeAgentId = null; render(); }
    function clearSearch() { appState.search = ''; render(); }
    function closePreview() { appState.previewFile = null; render(); }

    function openCloudModal() {
      appState.isCloudModalOpen = true;
      render();
    }

    function closeCloudModal() {
      appState.isCloudModalOpen = false;
      render();
    }

    async function saveCloudConfig() {
      const urlEl = document.getElementById('inputSbUrl');
      const keyEl = document.getElementById('inputSbKey');
      const url = urlEl ? urlEl.value.trim() : '';
      const key = keyEl ? keyEl.value.trim() : '';

      if (!url || !key) {
        alert('请完整填写 Supabase Project URL 和 Anon Key');
        return;
      }

      appState.supabaseUrl = url;
      appState.supabaseKey = key;
      localStorage.setItem(SUPABASE_CONFIG_KEY, JSON.stringify({ url, key }));

      if (initSupabaseClient()) {
        appState.isCloudModalOpen = false;
        await pullFromCloud(true);
      }
    }

    function openUploadModal(tab) {
      appState.uploadTab = tab || 'xlsx_pkg';
      if (appState.activeAgentId) appState.uploadTarget = appState.activeAgentId;
      appState.pendingXlsxSheets = null;
      appState.pendingXlsxFileName = '';
      appState.isUploadOpen = true;
      render();
    }

    function closeUploadModal() {
      appState.isUploadOpen = false;
      appState.pendingXlsxSheets = null;
      render();
    }

    function switchUploadTab(t) {
      appState.uploadTab = t;
      render();
    }

    function openXlsxModalForAgent(agentId) {
      appState.uploadTarget = agentId;
      appState.uploadTab = 'xlsx_pkg';
      appState.pendingXlsxSheets = null;
      appState.pendingXlsxFileName = '';
      appState.isUploadOpen = true;
      render();
    }

    function openFileModalForAgent(agentId) {
      appState.uploadTarget = agentId;
      appState.uploadTab = 'file';
      appState.isUploadOpen = true;
      render();
    }

    // 解析上传的任意格式 .xlsx / .xls / .csv
    function handleXlsxFileSelected(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      if (typeof XLSX === 'undefined') {
        alert('Excel 解析组件正在加载，请检查网络或稍后再试');
        return;
      }

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const parsedSheets = [];

          workbook.SheetNames.forEach(sheetName => {
            const ws = workbook.Sheets[sheetName];
            const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
            const nonEmptyRows = matrix.filter(row => Array.isArray(row) && row.some(cell => String(cell).trim() !== ''));
            if (nonEmptyRows.length > 0) {
              const rawHeaders = nonEmptyRows[0].map((h, i) => String(h).trim() || `列${i + 1}`);
              const dataRows = nonEmptyRows.slice(1).map(r => rawHeaders.map((_, cIdx) => (r[cIdx] !== undefined && r[cIdx] !== null ? String(r[cIdx]).trim() : '')));
              parsedSheets.push({
                id: 'TBL-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                fileName: file.name,
                sheetName: sheetName,
                updatedAt: new Date().toISOString().slice(0, 10),
                headers: rawHeaders,
                rows: dataRows
              });
            }
          });

          if (parsedSheets.length === 0) {
            showToast('该 Excel 文件中没有检测到有效数据行');
            return;
          }

          appState.pendingXlsxFileName = file.name;
          appState.pendingXlsxSheets = parsedSheets;
          render();
        } catch (err) {
          console.error(err);
          alert('解析 Excel 文件失败，请确认文件未加密且为标准 .xlsx/.xls/.csv 格式');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // 确认导入解析好的 Excel 套餐表并立即同步云端
    async function confirmXlsxImport() {
      if (!appState.pendingXlsxSheets || appState.pendingXlsxSheets.length === 0) return;
      const targetId = appState.uploadTarget;
      const mode = appState.xlsxImportMode;
      const agent = appState.agents.find(a => a.id === targetId);
      if (!agent) return;

      if (mode === 'replace') {
        agent.packageTables = [...appState.pendingXlsxSheets];
      } else {
        agent.packageTables = [...(agent.packageTables || []), ...appState.pendingXlsxSheets];
      }

      appState.isUploadOpen = false;
      appState.activeAgentId = targetId;
      const importedRowCount = appState.pendingXlsxSheets.reduce((s, tbl) => s + tbl.rows.length, 0);
      appState.pendingXlsxSheets = null;
      await saveState();
      showToast(`已成功更新 ${targetId} (${agent.name}) 的套餐表（共 ${importedRowCount} 条）并同步云端！`);
    }

    // 在网页内直接点击单元格修改套餐价格或信息
    async function updatePkgCellValue(agentId, tableIdx, rowIdx, colIdx, newText) {
      const agent = appState.agents.find(a => a.id === agentId);
      if (!agent || !agent.packageTables || !agent.packageTables[tableIdx]) return;
      const tbl = agent.packageTables[tableIdx];
      if (!tbl.rows[rowIdx]) return;
      const cleanVal = String(newText || '').trim();
      if (tbl.rows[rowIdx][colIdx] === cleanVal) return;
      tbl.rows[rowIdx][colIdx] = cleanVal;
      tbl.updatedAt = new Date().toISOString().slice(0, 10);
      await saveState();
      showToast(`已自动保存并同步修改：${cleanVal}`);
    }

    async function addRowToPkgTable(agentId, tableIdx) {
      const agent = appState.agents.find(a => a.id === agentId);
      if (!agent || !agent.packageTables || !agent.packageTables[tableIdx]) return;
      const tbl = agent.packageTables[tableIdx];
      const emptyRow = tbl.headers.map(() => '点击填写');
      tbl.rows.unshift(emptyRow);
      tbl.updatedAt = new Date().toISOString().slice(0, 10);
      await saveState();
      render();
      showToast('已在顶部新增一行，直接点击单元格即可输入套餐与价格');
    }

    async function deleteRowFromPkgTable(agentId, tableIdx, rowIdx) {
      const agent = appState.agents.find(a => a.id === agentId);
      if (!agent || !agent.packageTables || !agent.packageTables[tableIdx]) return;
      agent.packageTables[tableIdx].rows.splice(rowIdx, 1);
      await saveState();
      render();
      showToast('已删除该行套餐并同步云端');
    }

    async function deletePkgTable(agentId, tableIdx) {
      if (!confirm('确定要删除这张套餐表吗？')) return;
      const agent = appState.agents.find(a => a.id === agentId);
      if (!agent || !agent.packageTables) return;
      agent.packageTables.splice(tableIdx, 1);
      await saveState();
      render();
      showToast('已删除该套餐表并同步云端');
    }

    function exportSinglePkgTableToXlsx(agentId, tableIdx) {
      const agent = appState.agents.find(a => a.id === agentId);
      if (!agent || !agent.packageTables || !agent.packageTables[tableIdx]) return;
      const tbl = agent.packageTables[tableIdx];
      if (typeof XLSX === 'undefined') return;
      const aoa = [tbl.headers, ...tbl.rows];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, tbl.sheetName || '套餐报价表');
      XLSX.writeFile(wb, `${agent.id}_${agent.name}_最新套餐表_${new Date().toISOString().slice(0, 10)}.xlsx`);
      showToast('已导出最新套餐 Excel 文件');
    }

    function previewDoc(id) {
      const f = appState.files.find(x => x.id === id);
      if (f) { appState.previewFile = f; render(); }
    }

    async function deleteDoc(id) {
      if (!confirm('确定要删除这份文件吗？')) return;
      appState.files = appState.files.filter(x => x.id !== id);
      await saveState();
      render();
      showToast('已删除文件并同步云端');
    }

    function downloadDoc(id) {
      const f = appState.files.find(x => x.id === id);
      if (!f) return;
      if (f.dataUrl) {
        const a = document.createElement('a');
        a.href = f.dataUrl;
        a.download = f.name;
        a.click();
      } else if (f.textContent) {
        const blob = new Blob(['\uFEFF' + f.textContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = f.name;
        a.click();
        URL.revokeObjectURL(url);
      }
      showToast(`正在下载：${f.name}`);
    }

    function handleFileChosen(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const targetAgent = document.getElementById('fileAgentSelect').value;
      const targetCategory = document.getElementById('fileCategorySelect').value;
      const isText = file.type.includes('text') || file.name.endsWith('.txt') || file.name.endsWith('.csv');

      const reader = new FileReader();
      if (isText) {
        reader.onload = async (evt) => {
          appState.files.unshift({
            id: 'FILE-' + Date.now(),
            agentId: targetAgent,
            name: file.name,
            category: targetCategory,
            size: (file.size / 1024).toFixed(1) + ' KB',
            uploadDate: new Date().toISOString().slice(0, 10),
            textContent: evt.target.result
          });
          appState.isUploadOpen = false;
          await saveState();
          showToast(`已上传文件 ${file.name} 并同步云端`);
        };
        reader.readAsText(file, 'utf-8');
      } else {
        reader.onload = async (evt) => {
          appState.files.unshift({
            id: 'FILE-' + Date.now(),
            agentId: targetAgent,
            name: file.name,
            category: targetCategory,
            size: (file.size / 1024).toFixed(1) + ' KB',
            uploadDate: new Date().toISOString().slice(0, 10),
            dataUrl: evt.target.result,
            mimeType: file.type
          });
          appState.isUploadOpen = false;
          await saveState();
          showToast(`已上传文件 ${file.name} 并同步云端`);
        };
        reader.readAsDataURL(file);
      }
    }

    async function promptAddCard(agentId) {
      const qtyStr = prompt(`请输入本次为 ${agentId} 出卡的数量（张）：`, '100');
      if (qtyStr === null) return;
      const qty = parseInt(qtyStr, 10) || 0;
      const desc = prompt('请输入出卡说明或关联套餐：', '批量出卡出货');
      const agent = appState.agents.find(a => a.id === agentId);
      if (agent) {
        agent.totalCardsIssued = (Number(agent.totalCardsIssued)||0) + qty;
        agent.cardLogs = agent.cardLogs || [];
        agent.cardLogs.unshift({
          id: 'LOG-' + Date.now(),
          date: new Date().toISOString().slice(0, 10),
          type: '出卡记录',
          quantity: qty,
          pkgName: desc || '出卡',
          note: '手动登记出卡流水'
        });
        await saveState();
        showToast(`已为 ${agentId} 增加 ${qty} 张出卡记录并同步云端`);
      }
    }

    function exportBackup() {
      const str = JSON.stringify({ agents: appState.agents, files: appState.files }, null, 2);
      const blob = new Blob([str], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `SCT_代理工作台全量备份_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已导出全量数据备份 (.json)');
    }

    function restoreBackup(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (Array.isArray(parsed.agents)) appState.agents = parsed.agents;
          if (Array.isArray(parsed.files)) appState.files = parsed.files;
          await saveState();
          render();
          showToast('已成功恢复全量备份数据并同步云端！');
        } catch (err) {
          alert('备份文件格式错误');
        }
      };
      reader.readAsText(file, 'utf-8');
    }

    // 启动渲染与数据同步
    render();
    bootDataLoad();
  </script>
</body>
</html>
